<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生日快乐，江湘琪 🎂</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0a0e27;
    color: #fff;
    overflow-x: hidden;
    min-height: 100vh;
  }

  #stars {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  .star {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    animation: twinkle 3s infinite ease-in-out;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.2; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.4); }
  }

  .meteor {
    position: fixed;
    width: 2px;
    height: 2px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 6px 2px rgba(255,255,255,0.7);
    z-index: 1;
    pointer-events: none;
  }
  .meteor::after {
    content: "";
    position: absolute;
    top: 0; left: 0;
    width: 120px;
    height: 1px;
    background: linear-gradient(90deg, rgba(255,255,255,0.8), transparent);
    transform: translateX(-120px);
  }
  @keyframes meteorFall {
    0% { transform: translate(0,0) rotate(-45deg); opacity: 1; }
    100% { transform: translate(-500px,500px) rotate(-45deg); opacity: 0; }
  }

  .container {
    position: relative;
    z-index: 2;
    max-width: 900px;
    margin: 0 auto;
    padding: 60px 20px 80px;
    text-align: center;
  }

  .title {
    font-size: clamp(2.2rem, 8vw, 4.5rem);
    font-weight: 800;
    background: linear-gradient(135deg, #ffd86b, #ff8fb1, #a78bfa, #6ee7ff);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: gradientMove 6s ease infinite, fadeUp 1.2s ease both;
    letter-spacing: 2px;
    margin-bottom: 10px;
  }

  @keyframes gradientMove {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .name {
    font-size: clamp(1.6rem, 6vw, 2.8rem);
    font-weight: 700;
    color: #fff;
    margin-bottom: 30px;
    animation: fadeUp 1.2s 0.3s ease both;
    text-shadow: 0 0 20px rgba(255,216,107,0.5);
  }

  .name span { color: #ffd86b; }

  .wish {
    font-size: clamp(1rem, 3.5vw, 1.2rem);
    line-height: 2;
    color: rgba(255,255,255,0.85);
    max-width: 600px;
    margin: 0 auto 40px;
    animation: fadeUp 1.2s 0.6s ease both;
  }

  .cake-wrap {
    font-size: 80px;
    margin: 20px 0 10px;
    animation: fadeUp 1.2s 0.9s ease both;
    transition: transform 0.5s;
  }

  .cake-wrap.blown { transform: scale(1.1); }

  .btn {
    display: inline-block;
    padding: 14px 40px;
    font-size: 1.1rem;
    font-weight: 600;
    color: #0a0e27;
    background: linear-gradient(135deg, #ffd86b, #ff8fb1);
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 8px 30px rgba(255,143,177,0.4);
    transition: all 0.3s;
    animation: fadeUp 1.2s 1.2s ease both;
    font-family: inherit;
  }

  .btn:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 12px 40px rgba(255,143,177,0.6);
  }

  .btn:active { transform: scale(0.97); }

  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    margin-top: 60px;
    animation: fadeUp 1.2s 1.5s ease both;
  }

  .gallery img {
    width: 100%;
    aspect-ratio: 1/1;
    object-fit: cover;
    border-radius: 16px;
    border: 2px solid rgba(255,216,107,0.3);
    transition: all 0.4s;
    background: rgba(255,255,255,0.05);
  }

  .gallery img:hover {
    transform: scale(1.05) rotate(1deg);
    border-color: #ffd86b;
    box-shadow: 0 10px 30px rgba(255,216,107,0.3);
  }

  #confetti {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 99;
  }

  .music-btn {
    position: fixed;
    top: 20px; right: 20px;
    z-index: 100;
    width: 46px; height: 46px;
    border-radius: 50%;
    border: 2px solid rgba(255,216,107,0.5);
    background: rgba(10,14,39,0.7);
    color: #ffd86b;
    font-size: 20px;
    cursor: pointer;
    backdrop-filter: blur(6px);
    transition: all 0.3s;
  }
  .music-btn:hover { background: rgba(255,216,107,0.2); }

  .toast {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    background: linear-gradient(135deg, rgba(255,216,107,0.95), rgba(255,143,177,0.95));
    color: #0a0e27;
    padding: 24px 48px;
    border-radius: 20px;
    font-size: 1.3rem;
    font-weight: 700;
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: all 0.4s cubic-bezier(0.34,1.56,0.64,1);
  }
  .toast.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  .footer {
    margin-top: 60px;
    font-size: 0.85rem;
    color: rgba(255,255,255,0.4);
    animation: fadeUp 1.2s 1.8s ease both;
  }
</style>
</head>
<body>

<div id="stars"></div>

<button class="music-btn" id="musicBtn" title="播放/暂停音乐">♪</button>
<audio id="bgMusic" loop>
  <source src="http://c1.zhuanwenzi.com/1789051946443/110094/e191565b5f3a08aaaba22092315ed669.mp3" type="audio/mpeg">
</audio>

<div class="container">
  <h1 class="title">生日快乐</h1>
  <div class="name">致 <span>江湘琪</span></div>

  <p class="wish">
    生日快乐！<br>
    希望你在北京的日子都可以顺顺利利的！<br>
    一定一定要注意安全，好好照顾好自己。<br>
    这是我跟着D老师学做的链接…我尽力了！<br>
    希望你健健康康平平安安！万事顺意 ❤️
  </p>

  <div class="cake-wrap" id="cake">🎂</div>
  <br>
  <button class="btn" id="wishBtn">🕯️ 许个愿吧</button>

  <div class="gallery">
    <img src="https://images.pexels.com/photos/1729797/pexels-photo-1729797.jpeg?auto=compress&cs=tinysrgb&w=600" alt="生日蛋糕">
    <img src="https://images.pexels.com/photos/796606/pexels-photo-796606.jpeg?auto=compress&cs=tinysrgb&w=600" alt="气球派对">
    <img src="https://memegen.link/custom/404/not-found.jpg?font=impact" alt="搞笑表情1">
    <img src="https://memegen.link/custom/404/not-found.jpg?font=impact" alt="搞笑表情2">
  </div>

  <div class="footer">—— 来自爱你的QQ ❤️</div>
</div>

<canvas id="confetti"></canvas>
<div class="toast" id="toast">愿望已经听到啦 ✨</div>

<script>
const starsEl = document.getElementById('stars');
for (let i = 0; i < 120; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  const size = Math.random() * 2 + 1;
  s.style.width = size + 'px';
  s.style.height = size + 'px';
  s.style.left = Math.random() * 100 + '%';
  s.style.top = Math.random() * 100 + '%';
  s.style.animationDelay = Math.random() * 3 + 's';
  starsEl.appendChild(s);
}

function createMeteor() {
  const m = document.createElement('div');
  m.className = 'meteor';
  m.style.left = Math.random() * 80 + 20 + '%';
  m.style.top = Math.random() * 40 + '%';
  const dur = Math.random() * 1.5 + 1.5;
  m.style.animation = `meteorFall ${dur}s linear forwards`;
  document.body.appendChild(m);
  setTimeout(() => m.remove(), dur * 1000);
}
setInterval(createMeteor, 2500);
setTimeout(createMeteor, 800);

const canvas = document.getElementById('confetti');
const ctx = canvas.getContext('2d');
let confettiPieces = [];
let confettiRunning = false;

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const colors = ['#ffd86b','#ff8fb1','#a78bfa','#6ee7ff','#6bffb8','#ff6b6b'];

function launchConfetti() {
  confettiPieces = [];
  for (let i = 0; i < 150; i++) {
    confettiPieces.push({
      x: Math.random() * canvas.width,
      y: -20 - Math.random() * canvas.height * 0.5,
      w: Math.random() * 8 + 4,
      h: Math.random() * 6 + 3,
      color: colors[Math.floor(Math.random() * colors.length)],
      vy: Math.random() * 3 + 2,
      vx: Math.random() * 2 - 1,
      rot: Math.random() * 360,
      vr: Math.random() * 6 - 3
    });
  }
  if (!confettiRunning) {
    confettiRunning = true;
    animateConfetti();
  }
}

function animateConfetti() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  confettiPieces.forEach(p => {
    p.y += p.vy;
    p.x += p.vx;
    p.rot += p.vr;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot * Math.PI / 180);
    ctx.fillStyle = p.color;
    ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
    ctx.restore();
  });
  confettiPieces = confettiPieces.filter(p => p.y < canvas.height + 30);
  if (confettiPieces.length > 0) {
    requestAnimationFrame(animateConfetti);
  } else {
    confettiRunning = false;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
}

const wishBtn = document.getElementById('wishBtn');
const cake = document.getElementById('cake');
const toast = document.getElementById('toast');
let wished = false;

wishBtn.addEventListener('click', () => {
  if (!wished) {
    cake.textContent = '🍰';
    cake.classList.add('blown');
    launchConfetti();
    toast.classList.add('show');
    wishBtn.textContent = '🎉 再庆祝一次';
    wished = true;
    setTimeout(() => toast.classList.remove('show'), 2200);
  } else {
    launchConfetti();
  }
});

const musicBtn = document.getElementById('musicBtn');
const bgMusic = document.getElementById('bgMusic');
let playing = false;

musicBtn.addEventListener('click', () => {
  if (playing) {
    bgMusic.pause();
    musicBtn.textContent = '♪';
  } else {
    bgMusic.play();
    musicBtn.textContent = '❚❚';
  }
  playing = !playing;
});
</script>
</body>
</html>
